name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: [README.md, "assets/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Lint (includes security rules)
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type-check
        run: uv run pyright
      - name: Tests with coverage
        run: uv run pytest
      - name: Dry run against live GitHub data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run python build.py
          grep -n "contributions and" README.md
