name: Update profile page

on:
  schedule:
    - cron: "17 13 * * *" # every day at 13:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [build.py]

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild the page
        env:
          # A personal token (repo secret PROFILE_TOKEN) wins if one is ever needed.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
        run: python build.py
      - name: Commit the result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "Nothing changed; no commit."
          else
            git commit -m "chore: rebuild profile page"
            git push
          fi
