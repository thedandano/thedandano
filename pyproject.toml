[project]
name = "thedandano-profile"
version = "0.1.0"
description = "Rebuilds the github.com/thedandano profile page from live GitHub data."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pyright>=1.1.380", "pre-commit>=3.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=build --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C90", "N", "S", "SIM", "UP", "PL", "RET", "BLE"]

[tool.ruff.lint.mccabe]
max-complexity = 6

[tool.ruff.lint.pylint]
max-args = 4
max-branches = 6
max-statements = 25

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004"]

[tool.pyright]
include = ["build.py", "tests"]
typeCheckingMode = "standard"
